selection_report: outputs/argument_mining_experiment/abstrct_dev_summary_20260919/report.md
dataset_used_for_selection: AbstRCT dev/neoplasm_dev (50 documents)
application_data_used_for_tuning: false
random_seed: 42

selection_rationale:
  segmentation: "DSG is the frozen segmentation candidate justified by the auxiliary AbstRCT benchmark and its lightweight, traceable official implementation."
  propositionalisation: "SPG is a structural, xAIF-compatible baseline; no normalised human gold propositions were available, so it is not claimed empirically best."
  relation_identification: "SARIM is a provisional baseline: it had the highest evaluated Support/Attack macro-F1 (0.1740), but Support precision was low (0.1660) and Attack performance was insufficient (F1 0.0690; 1/8 correct). It is not claimed optimal."
limitations:
  - "AbstRCT is an auxiliary benchmark used only to justify a reproducible application configuration."
  - "The public ARG-tech endpoints are suitable for this pilot but do not provide immutable service or model digests. Official repositories are pinned for provenance."
  - "No CasiMedicos-Arg application case, annotation, or silver label was used for module tuning."

